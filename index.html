<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Island Gridiron GM</title>
<meta name="description" content="Island Gridiron GM: a Hawaiʻi high school football GM game. Call plays, recruit, and play a friend online.">
<meta name="theme-color" content="#0a1726">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Standalone build: online play goes browser to browser (WebRTC through PeerJS), so a friend needs only the link.
window.IG_STANDALONE=true;
(function(){
  const PFX='islandgridiron-gm-';
  function join(name,opt){return new Promise((res,rej)=>{
    if(!window.Peer){rej({code:'unavailable',message:'PeerJS did not load'});return}
    const role=opt&&opt.role, hostId=PFX+name, L={}, PL=[], CL=[], conns=new Map(); let peer=null, open=false, done=false, lastDial=0;
    const fire=(arr,v)=>arr.forEach(f=>{try{f(v)}catch(e){}});
    const deliver=(topic,data,from,same)=>(L[topic]||[]).forEach(f=>{try{f({topic,data,peer:from,by:null,isMe:!!same,sameTab:!!same,kind:'viewer',guest:false})}catch(e){}});
    const wire=c=>{
      c.on('open',()=>{conns.set(c.peer,c);fire(PL,{peers:[...conns.keys()].map(p=>({peer:p})),joined:[{peer:c.peer}],left:[],updated:[]})});
      c.on('data',m=>{if(m&&typeof m==='object'&&typeof m.topic==='string')deliver(m.topic,m.data,c.peer,false)});
      c.on('close',()=>{if(conns.get(c.peer)===c){conns.delete(c.peer);fire(PL,{peers:[...conns.keys()].map(p=>({peer:p})),joined:[],left:[{peer:c.peer}],updated:[]})}});
      c.on('error',()=>{});
    };
    const dial=()=>{if(role==='host'||!peer||!open)return;lastDial=Date.now();try{wire(peer.connect(hostId,{reliable:true}))}catch(e){}};
    const room={name,
      emit:async(topic,data)=>{const s=JSON.stringify(data);
        if(role!=='host'&&![...conns.values()].some(c=>c.open)&&Date.now()-lastDial>3000)dial();
        for(const c of conns.values())if(c.open){try{c.send({topic,data})}catch(e){}}
        setTimeout(()=>deliver(topic,JSON.parse(s),peer&&peer.id,true),0)},
      on:(t,f)=>{(L[t]=L[t]||[]).push(f);return()=>{L[t]=L[t].filter(x=>x!==f)}},
      onPeers:f=>{PL.push(f);return()=>{}},
      onConnection:f=>{CL.push(f);setTimeout(()=>f(open),0);return()=>{}},
      connected:()=>open, presence:async()=>{}, peers:()=>[...conns.keys()].map(p=>({peer:p})),
      leave:async()=>{try{peer.destroy()}catch(e){}}};
    try{peer=role==='host'?new Peer(hostId):new Peer()}catch(e){rej({code:'unavailable',message:String(e)});return}
    if(role==='host')peer.on('connection',wire);
    peer.on('open',()=>{open=true;fire(CL,true);if(!done){done=true;dial();res(room)}});
    peer.on('disconnected',()=>{open=false;fire(CL,false);setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
    peer.on('error',e=>{const t=e&&e.type;if(t==='peer-unavailable')return;
      if(!done){done=true;rej({code:t==='unavailable-id'?'conflict':'unavailable',message:String(t)})}});
    setTimeout(()=>{if(!done){done=true;rej({code:'unavailable',message:'timeout'})}},15000);
  })}
  const ROOM={join};
  window.claude={use:async n=>n==='room'?ROOM:null};
})();
</script>
<style>html,body{margin:0;padding:0}body{font-family:system-ui,sans-serif}</style>
</head>
<body>

<style>
/* Layout: Friday-night stadium. Scoreboard header, tabbed sections, the field as the centerpiece on game day. Single dark look by design. */
:root{
  --night:#0b1a26; --panel:#10243a; --panel2:#163150; --line:#244461;
  --chalk:#eef3ec; --mute:#93abbd; --amber:#f6b73c; --amber-ink:#1a1204;
  --win:#52c58d; --loss:#f06464; --los:#5aa9ff; --chain:#f6d743;
  --turf1:#2b6a43; --turf2:#28623e;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html{background:var(--night)}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
.brand{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);font-size:12px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:15px;color:var(--amber)}
p{margin:0}
.muted{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.school{font-family:var(--display);font-weight:900;font-size:clamp(34px,8vw,58px);line-height:.88;text-transform:uppercase;margin-top:4px}
.school small{display:block;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.12em;color:var(--amber);margin-top:8px}
.meta{display:flex;gap:22px;flex-wrap:wrap}
.stat .k{font-family:var(--cond);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px;scrollbar-width:none;margin-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--mute);padding:8px 13px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--chalk)}
.tab[aria-current="true"]{color:var(--amber-ink);background:var(--amber)}

/* panels */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.feature{background:linear-gradient(160deg,var(--panel2),var(--panel));}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* matchup */
.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.mt .n{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,32px);text-transform:uppercase;line-height:1}
.mt .s{font-size:13px;color:var(--mute)}
.mt.r{text-align:right}
.vs{font-family:var(--cond);font-weight:700;color:var(--mute);letter-spacing:.1em}
.cmp{display:grid;grid-template-columns:3.2em 1fr 2.4em 1fr 2.4em;gap:6px 8px;align-items:center;font-size:13px}
.cmp .l{font-family:var(--cond);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:4px}
.bar.rev{transform:scaleX(-1)}
.bar.opp i{background:var(--mute)}
.result{font-family:var(--display);font-weight:900;font-size:40px;line-height:1}
.result.w{color:var(--win)} .result.l{color:var(--loss)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li .rk{font-family:var(--display);font-weight:800;width:1.8em;color:var(--mute);font-variant-numeric:tabular-nums}
.li .grow{flex:1;min-width:0}
.li.me{color:var(--amber)}
.news .li{font-size:14px}
.tag{font-family:var(--cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.good{color:var(--win)} .bad{color:var(--loss)}
.mv{font-size:11px;font-family:var(--cond);width:2.4em;text-align:right}

table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.me td{color:var(--amber)}
.tw{overflow-x:auto;margin:0 -4px}
.ovr{font-family:var(--display);font-weight:800;font-size:17px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:middle}
.dot.off{background:transparent;border:1px solid var(--line)}

/* game */
.bug{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;background:#07121b;border:1px solid var(--line);border-radius:10px;padding:8px}
.bt{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:7px;border-left:6px solid var(--tc);background:var(--panel);min-width:0}
.bt.away{flex-direction:row-reverse;border-left:0;border-right:6px solid var(--tc);text-align:right}
.bt .ab{font-family:var(--display);font-weight:800;font-size:22px}
.bt .nm{font-size:12px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt b{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bt.has .ab::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin:0 6px;vertical-align:middle}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;text-align:center}
.clk{font-family:var(--display);font-weight:800;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.dd{font-family:var(--cond);font-size:13px;letter-spacing:.06em;color:var(--mute);white-space:nowrap}
.fieldwrap{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--turf1)}
canvas#field{display:block;width:100%}
.calls{display:flex;flex-direction:column;gap:10px;min-height:86px}
.prompt{font-family:var(--cond);font-size:17px;letter-spacing:.03em}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 11px;font-family:var(--cond);font-weight:600;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--chalk)}
.log{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border-top:1px solid var(--line)}
.lg{display:grid;grid-template-columns:5.2em 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.lg .q{font-family:var(--cond);color:var(--mute);font-variant-numeric:tabular-nums}
.lg.sc{color:var(--amber)}
.lg.sys{color:var(--mute);font-style:italic}
.gamewrap{display:flex;flex-direction:column;gap:12px}
.side{display:flex;flex-direction:column;gap:2px;margin-top:2px}
body.fs{overflow:hidden;padding:0!important}
body.fs #app>.top,body.fs #app>.tabs,body.fs .foot,body.fs .log{display:none}
body.fs .gamewrap{position:fixed;inset:0;z-index:25;background:var(--night);padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));gap:8px;overflow:hidden}
body.fs .fieldwrap{flex:none}
body.fs .calls{min-height:0;padding:6px 12px;gap:2px}
body.fs .calls .prompt{font-size:15px}
body.fs .calls .small{display:none}
body.fs .ctrl{flex-wrap:nowrap;overflow-x:auto;gap:6px}body.fs .ctrl .row{flex-wrap:nowrap}body.fs .ctrl .btn{white-space:nowrap}body.fs .ctrl>[data-a="fs"]{order:-1}
body.fs .dock{z-index:40}
body.fs #toast{z-index:50}
.lead{font-size:14px;display:flex;flex-direction:column;gap:3px}

/* recruiting */
.rgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.rgrid{grid-template-columns:1fr}.rgrid>aside{order:2}}
.filters{display:flex;flex-wrap:wrap;gap:8px}
select{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc.mine{border-color:var(--win)}
.pc .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.stars{color:var(--amber);letter-spacing:1px;font-size:14px}
.stars .e{color:var(--line)}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}
.kv b{color:var(--chalk);font-weight:600}
.ib{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.chip{display:inline-block;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.good{border-color:var(--win);color:var(--win)}
.chip.need{border-color:var(--amber);color:var(--amber)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.hours{font-family:var(--display);font-weight:900;font-size:48px;line-height:1;color:var(--amber)}

/* recruiting depth */
.linkname{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1;color:var(--chalk)}
.linkname.sm{font-family:var(--body);font-weight:600;font-size:14px;text-transform:none}
.linkname:hover{color:var(--amber)}
.why{display:flex;flex-direction:column;gap:2px;font-size:13px}
.why span:not(.muted)::before{content:"› ";color:var(--amber)}
.pname{font-family:var(--display);font-weight:900;font-size:clamp(34px,8vw,58px);line-height:.9;text-transform:uppercase;margin:6px 0 10px;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px 18px}
.fact .k{font-family:var(--cond);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.fact .v{font-weight:600}
.bio{max-width:68ch;line-height:1.6}
.attrs{display:grid;grid-template-columns:minmax(0,auto) minmax(60px,1fr) 2.4em;gap:8px 10px;align-items:center;font-size:13px}
.imp{color:var(--amber);letter-spacing:1px;font-size:12px;min-width:3.2em}
.small{font-size:13px}
.amber{color:var(--amber)}
.tos{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}.tos i{width:7px;height:7px;border-radius:2px;background:var(--line)}.tos i.on{background:var(--amber)}
table.roster td{vertical-align:middle}
tr.starter td{background:rgba(246,183,60,.05)}
td.dep{white-space:nowrap}
.ic{background:none;border:1px solid var(--line);border-radius:5px;color:var(--chalk);width:24px;height:24px;margin-left:4px;cursor:pointer;font-size:11px;line-height:1}
.ic:disabled{opacity:.3;cursor:default}
.fieldwrap{position:relative}
canvas.field3{display:block;width:100%}
.fieldwrap.v3::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.38) 100%)}
.tag3.sm{font-size:10px;padding:0 4px;background:rgba(7,18,27,.7)}.tag3.aw{color:#ffe3a3}
.tag3{position:absolute;transform:translate(-50%,-130%);background:rgba(7,18,27,.85);color:#fff;font:700 12px "Barlow Condensed",Arial,sans-serif;padding:1px 6px;border-radius:4px;pointer-events:none;white-space:nowrap}
.vsel{display:inline-flex;align-items:center;gap:6px}
.vsel select{padding:5px 8px;font-size:13px}
/* playbook */
.schemes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.scheme{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer}
.scheme[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.scheme .n{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.scheme .s{font-size:13px;color:var(--mute)}
.pbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.pb{display:flex;flex-direction:column;gap:6px;min-width:0}
.pbn{font-family:var(--cond);font-size:18px;letter-spacing:.03em}
.pbsvg{width:100%;height:auto;display:block;background:var(--turf2);border-radius:8px}
.pb-los{stroke:var(--los);stroke-width:2}
.pb-x{stroke:rgba(238,243,236,.45);stroke-width:1.6}
.pb-rt{fill:none;stroke:var(--chalk);stroke-width:1.8;stroke-linejoin:round}
.pb-hot{fill:none;stroke:var(--amber);stroke-width:2.4;stroke-linejoin:round}
.pb-run{fill:none;stroke:var(--amber);stroke-width:2.4;stroke-dasharray:6 4;stroke-linejoin:round}
.pb-o{fill:var(--night);stroke:var(--chalk);stroke-width:1.6}
.pb-o.hot{fill:var(--amber);stroke:var(--amber)}
.pb-o.dim{opacity:.55}
.pb-x.d{stroke:var(--chalk);stroke-width:2}.pb-x.d.r{stroke:var(--loss)}
.pb-deep{fill:rgba(90,169,255,.16);stroke:rgba(90,169,255,.55);stroke-width:1.2}
.pb-uz{fill:rgba(246,183,60,.12);stroke:rgba(246,183,60,.5);stroke-width:1.1}
.pb-drop{stroke:rgba(238,243,236,.4);stroke-width:1.2;stroke-dasharray:3 3}
.pb-man{stroke:var(--chalk);stroke-width:1.5;stroke-dasharray:5 4}
.pb-rush{stroke:var(--loss);stroke-width:2}
.dseg{display:flex;align-items:center;gap:8px;margin-left:auto}.dseg .seg button{padding:4px 10px}
.callgrp{display:flex;flex-direction:column;gap:6px}
.btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
/* emblems */
.crest{flex:none;display:inline-block;vertical-align:middle}
.crest.logo{background:#fff;border-radius:18%;padding:3px;object-fit:contain;box-sizing:border-box}
.who{display:flex;gap:16px;align-items:center;min-width:0}
.who .crest.big{width:clamp(56px,14vw,84px);height:auto}
.pick .crest{margin-bottom:4px}
.mt .crest{margin-bottom:6px;width:clamp(40px,11vw,60px);height:auto}
.matchup{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.mt{min-width:0}
.mt .n{overflow-wrap:anywhere;font-size:clamp(18px,5vw,32px)}
.bt .crest{width:34px;height:34px}
@media (max-width:560px){.bt .crest{display:none}}
/* play-call dock */
body.docked{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:2px solid var(--amber);box-shadow:0 -10px 30px rgba(0,0,0,.45);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dinner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--cond);font-size:16px;letter-spacing:.03em}
.dcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.dgrp{flex:none;display:flex;align-items:center;justify-content:center;width:18px}
.dgrp span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.bstar{background:none;border:0;padding:0 2px;font-size:18px;line-height:1;color:var(--mute);cursor:pointer}.bstar.on{color:var(--amber)}
.pcard{flex:none;width:132px;display:flex;flex-direction:column;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;text-align:left;position:relative;scroll-snap-align:start}
.pcard:hover,.pcard:focus-visible{border-color:var(--amber)}
.pcard .pbsvg{border-radius:5px}
.pcard .pn{font-family:var(--cond);font-weight:700;font-size:14px;line-height:1.1}
.pcard .pt{font-size:11px;color:var(--mute);line-height:1.25}
.pcard .kk{position:absolute;top:8px;left:10px;font-family:var(--cond);font-weight:700;font-size:11px;color:var(--chalk);background:rgba(11,26,38,.75);border-radius:4px;padding:0 5px;z-index:1}
.pcard.st,.pcard.def{width:150px;justify-content:flex-end;min-height:118px;padding:10px 10px 8px}
.pcard .big{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
@media (max-width:560px){.pcard{width:112px}.pcard.st,.pcard.def{width:132px;min-height:104px}body.docked{padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}}
/* playoffs */
.bwrap{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr)) minmax(170px,.8fr);gap:14px;min-width:780px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bh{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.mbox.live{border-color:var(--amber)}
.bt2{display:grid;grid-template-columns:1.4em 22px minmax(0,1fr) 2.2em;gap:6px;align-items:center;padding:6px 8px;font-size:14px}
.bt2+.bt2{border-top:1px solid var(--line)}
.bt2 .sd{font-family:var(--cond);color:var(--mute);font-size:12px;text-align:right}
.bt2 .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt2 b{text-align:right;font-variant-numeric:tabular-nums}
.bt2.lost{opacity:.5}
.bt2.me .tn{color:var(--amber);font-weight:600}
.bt2.tbd .tn{color:var(--mute);font-style:italic;font-size:13px}
.mlab{font-family:var(--cond);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:3px 8px 5px;border-top:1px solid var(--line)}
.champ{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--amber);border-radius:10px;padding:10px}
.champ b{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.champ.empty{border-style:dashed;border-color:var(--line);flex-direction:column;align-items:flex-start}
tr.cut td{border-bottom:2px dashed var(--amber)}
.chip.bad-chip{border-color:var(--loss);color:var(--loss)}
/* start */
.hero{padding-block:36px 22px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,12vw,104px);line-height:.85;text-transform:uppercase;letter-spacing:-.005em}
.hero h1 span{color:var(--amber)}
.lede{max-width:58ch;color:var(--mute);font-size:17px;margin-top:14px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.pick{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:9px;padding:12px 14px;cursor:pointer}
.pick:hover{border-color:var(--amber);border-left-color:var(--tc)}
.pick .n{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.pick .s{font-size:13px;color:var(--mute)}
.lvl{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.sec{font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-size:13px;margin:22px 0 10px}
.foot{color:var(--mute);font-size:13px;margin-top:26px;max-width:70ch}
#toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--amber);color:var(--amber-ink);font-weight:600;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.art .ahead{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.4vw,34px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.art .ahead.sm{font-size:21px}
.art .abody{font-size:16px;line-height:1.6;max-width:68ch;margin:12px 0 0}
.art .abody.small{font-size:14px;color:var(--mute);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art .pre{white-space:pre-wrap}
.art details{margin-top:14px}
.teaser .btn{margin-top:10px}
td.setc{white-space:normal;font-size:13px;min-width:9em}

/* ---- Friday-night theme: stadium-light glow, faint yard lines, scoreboard type, jersey-cut buttons ---- */
:root{--glow:rgba(246,183,60,.38);--glass:rgba(13,30,48,.86)}
html{background:#081520}
body{background:
  radial-gradient(1100px 460px at 50% -160px,rgba(120,180,255,.18),transparent 70%),
  repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(238,243,236,.028) calc(10% - 1px) 10%),
  linear-gradient(180deg,#0a1826 0%,#0b1c22 55%,#0a1a17 100%);background-attachment:fixed}
.top{border-bottom:0;padding-bottom:18px;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:
  linear-gradient(var(--line),var(--line)) bottom/100% 1px no-repeat,
  repeating-linear-gradient(90deg,rgba(238,243,236,.55) 0 2px,transparent 2px 24px) bottom left/100% 7px no-repeat}
.school{text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 28px rgba(246,183,60,.12)}
.top .stat .v{color:#ffd56a;text-shadow:0 0 14px var(--glow)}
.tabs{background:rgba(9,22,35,.75);border:1px solid var(--line);border-radius:12px;padding:5px;margin-block:12px 14px;gap:2px;backdrop-filter:blur(6px)}
.tab{border-radius:8px;padding:8px 14px}
.tab[aria-current="true"]{background:linear-gradient(180deg,#ffc95a,#e9a52b);color:var(--amber-ink);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);border-radius:0;box-shadow:0 0 18px var(--glow)}
.panel{background:linear-gradient(180deg,rgba(23,50,80,.92),rgba(14,33,53,.94));border-color:rgba(70,110,150,.35);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05)}
.panel.feature{background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 48px,transparent 48px 96px),linear-gradient(160deg,#1b3d63,#10243a)}
h2{display:flex;align-items:center;gap:9px}
h2::before{content:"";flex:none;width:16px;height:11px;background:repeating-linear-gradient(90deg,var(--amber) 0 2px,transparent 2px 4.5px);border-radius:1px}
.btn{border-radius:9px;background:linear-gradient(180deg,#1d3d60,#15304d);border-color:rgba(90,130,170,.45);transition:transform .08s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--amber);box-shadow:0 0 0 1px rgba(246,183,60,.25)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#ffcb5c,#e9a52b);border-color:#ffcb5c;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);border-radius:0;padding-inline:22px;box-shadow:0 0 22px var(--glow)}
.chip{border-radius:5px;background:rgba(9,22,35,.5)}
.pc,.pcard{background:linear-gradient(180deg,#1a3a5e,#122a45);border-color:rgba(80,120,160,.4);border-radius:12px;transition:transform .12s,box-shadow .12s,border-color .12s}
.pc:hover,.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.35)}
.pcard{position:relative;overflow:hidden}.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--amber),transparent)}
/* broadcast score bug */
.bug{background:linear-gradient(180deg,#132c47,#07111b);border:1px solid rgba(90,130,170,.4);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.45);padding:7px}
.bt{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 34%,#0c1a28),#0d1c2b 75%);border-left-width:7px;border-radius:9px}
.bt.away{background:linear-gradient(270deg,color-mix(in srgb,var(--tc) 34%,#0c1a28),#0d1c2b 75%);border-right-width:7px}
.bt b{text-shadow:0 2px 0 rgba(0,0,0,.4)}
.mid{background:#05090e;border:1px solid #233a52;border-radius:9px;padding:4px 12px;box-shadow:inset 0 0 14px rgba(0,0,0,.8)}
.clk{color:#ffcf55;text-shadow:0 0 10px var(--glow);letter-spacing:.04em}
.fieldwrap{border:2px solid rgba(255,255,255,.07);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.dock{background:rgba(10,24,38,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:0;box-shadow:0 -1px 0 var(--amber),0 -14px 34px rgba(0,0,0,.5)}
.dock::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:repeating-linear-gradient(90deg,var(--amber) 0 18px,transparent 18px 26px);opacity:.55}
.dhead b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.calls{background:linear-gradient(180deg,rgba(23,50,80,.9),rgba(14,33,53,.92))}
.prompt{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em}
table tbody tr:nth-child(even) td{background:rgba(255,255,255,.018)}
th{color:#a9c1d3}
@media (prefers-reduced-motion:reduce){.pc,.pcard,.btn{transition:none}.pc:hover,.pcard:hover{transform:none}}

/* ---- Coach's whiteboard: menus and panels are dry-erase boards in an aluminum frame, written in marker ---- */
:root{--marker:'Permanent Marker','Kalam','Comic Sans MS',cursive;--hand:'Kalam','Comic Sans MS',cursive;--ink:#1d2733;--blue:#1f4fb3;--red:#c62f2f;--green:#1d7a45}
.panel,.pc,.dock,.calls{
  --chalk:var(--ink);--mute:#5c6876;--amber:var(--red);--amber-ink:#fff;--line:#c9d1da;--panel:#f6f8f9;--panel2:#eef2f5;--win:var(--green);--loss:var(--red);--night:#f6f8f9;--turf2:#fbfcfd;
  color:var(--ink);
  background:
    radial-gradient(120% 80% at 12% 8%,rgba(255,255,255,.95),transparent 55%),
    radial-gradient(60% 40% at 80% 85%,rgba(90,110,140,.06),transparent 70%),
    linear-gradient(160deg,#fdfefe 0%,#eef2f5 100%)!important;
  border:0!important;border-radius:6px!important;
  box-shadow:0 0 0 5px #b8c1ca,0 0 0 6px #8e99a5,0 0 0 8px #d9dfe5,0 12px 28px rgba(0,0,0,.45)!important}
.panel{margin:4px}
.pc{margin:3px}
.stack,.grid{gap:22px}
.panel h2,.pc h2{font-family:var(--marker);font-weight:400;font-size:20px;letter-spacing:.02em;text-transform:none;color:var(--blue)}
.panel h2::before{content:"X O";width:auto;height:auto;background:none;font-family:var(--marker);font-size:15px;color:var(--red);letter-spacing:.1em;transform:rotate(-4deg)}
.panel .stat .v,.calls .prompt,.pc .nm,.pc .linkname,.pname,.dhead b,.pcard .pn,.pcard .big{font-family:var(--marker);font-weight:400;letter-spacing:.01em;color:var(--ink)}
.panel .stat .v{font-size:30px}
.panel .tag,.panel .stat .k,.panel th,.pc .tag{color:#5c6876}
.panel .muted,.pc .muted,.calls .muted,.dock .muted{color:#5c6876}
.panel .small,.pc .why span,.panel .bio{font-family:var(--hand);font-size:15px}
.panel .li,.panel table td,.panel th{border-color:#d3dae2}
.panel table tbody tr:nth-child(even) td{background:rgba(31,79,179,.035)}
.panel tr.me td,.panel .li.me{background:rgba(198,47,47,.07)}
.panel .btn,.pc .btn,.dock .btn,.calls .btn{background:#fff!important;color:var(--ink);border:2px solid var(--ink);border-radius:8px 10px 7px 11px;font-family:var(--cond);box-shadow:none;clip-path:none}
.panel .btn:hover,.pc .btn:hover,.calls .btn:hover{border-color:var(--blue);color:var(--blue)}
.panel .btn.pri,.pc .btn.pri,.calls .btn.pri{background:var(--blue)!important;border-color:var(--blue);color:#fff;padding-inline:18px}
.panel .btn[aria-pressed="true"],.dock .btn[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.panel select,.pc select,.dock select{background:#fff;color:var(--ink);border:2px solid #9aa6b2}
.panel .chip,.pc .chip{background:transparent;border:2px solid #8996a3;color:var(--ink);border-radius:50% 45% 52% 48%/60% 55% 45% 40%;font-family:var(--hand);font-size:13px;text-transform:none;letter-spacing:0;padding:1px 9px}
.panel .chip.good,.pc .chip.good{border-color:var(--green);color:var(--green)}
.panel .chip.bad,.pc .chip.bad,.chip.bad-chip{border-color:var(--red);color:var(--red)}
.panel .chip.need,.pc .chip.need{border-color:var(--red);color:var(--red)}
.panel .bar,.pc .bar{background:#dde3e9;height:8px}
.panel .bar i,.pc .bar i{background:var(--blue)}
.panel .bar.opp i,.pc .bar.opp i{background:#8e99a5}
.pc:hover{transform:translateY(-2px) rotate(-.3deg)}
.pc .linkname,.panel .linkname{color:var(--ink)}
.panel .amber,.pc .amber{color:var(--red)}
.panel .good{color:var(--green)}.panel .bad{color:var(--red)}
.panel .crest.logo{box-shadow:0 0 0 1px #c9d1da}
/* play cards: Xs and Os in marker on a little board */
.pbsvg{background:#fbfcfd!important;border:1px solid #d3dae2}
.dock .pb-los,.pc .pb-los,.panel .pb-los{stroke:#9aa6b2;stroke-dasharray:5 4;stroke-width:1.6}
.dock .pb-x,.panel .pb-x{stroke:var(--red)!important;stroke-width:2.2}
.dock .pb-o,.panel .pb-o{fill:#fff;stroke:var(--ink);stroke-width:2}
.dock .pb-o.hot,.panel .pb-o.hot{fill:var(--blue);stroke:var(--blue)}
.dock .pb-rt,.panel .pb-rt{stroke:var(--ink)}
.dock .pb-hot,.dock .pb-run,.panel .pb-hot,.panel .pb-run{stroke:var(--blue)}
.dock .pb-deep{fill:rgba(31,79,179,.1);stroke:rgba(31,79,179,.55)}.dock .pb-uz{fill:rgba(198,47,47,.08);stroke:rgba(198,47,47,.5)}
.dock .pb-man{stroke:var(--ink)}.dock .pb-rush{stroke:var(--red)}.dock .pb-x.d{stroke:var(--red)!important}
.dock{border-radius:0!important;box-shadow:0 -5px 0 #b8c1ca,0 -6px 0 #8e99a5,0 -20px 36px rgba(0,0,0,.45)!important;backdrop-filter:none}
.dock::before{background:linear-gradient(180deg,#d9dfe5,#a9b3bd);height:6px;opacity:1}
.dock .pcard{background:#fff;border:2px solid #c9d1da;box-shadow:2px 3px 0 rgba(0,0,0,.08)}
.dock .pcard::before{background:var(--red);height:2px;opacity:.7}
.dock .pcard:hover{border-color:var(--blue);transform:translateY(-2px) rotate(-.4deg)}
.dock .pcard .pt,.dock .dgrp span{color:#5c6876;font-family:var(--hand)}
.dock .kk{background:var(--ink);color:#fff}
.dock .dhead b{font-size:21px}
.dock .seg button{color:var(--ink)}.dock .seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
/* the eraser tray under each board */
.panel::after{content:"";display:block;height:0}
.calls .prompt{font-size:22px}
.mt .n{font-size:clamp(18px,3.4vw,28px);overflow-wrap:normal;word-break:normal;hyphens:manual}
.netlobby h3{font-family:var(--display);margin:0 0 6px}
.fld{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.codein{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:7px;padding:9px 12px;font:700 22px var(--cond);letter-spacing:.3em;text-transform:uppercase;width:9em;max-width:100%}
.netcode{display:flex;gap:10px;margin:8px 0 14px}.netcode span{display:grid;place-items:center;width:58px;height:70px;border-radius:10px;background:var(--panel2);border:2px solid var(--amber);font:800 40px var(--cond);color:var(--chalk)}
.netsteps{margin:10px 0 16px;padding-left:20px;line-height:1.55}.netsteps li{margin:4px 0}
.netban{border-left:4px solid var(--amber);background:rgba(246,183,60,.12);padding:8px 10px;border-radius:6px;margin:0 0 8px;font-size:14px}.netban.bad{border-color:#e0574f;background:rgba(224,87,79,.14)}
.title{position:fixed;inset:0;z-index:20;overflow-x:hidden;overflow-y:auto;display:flex;justify-content:center;background:radial-gradient(120% 70% at 50% 0%,#17365a 0%,#0a1726 55%,#050b13 100%)}
.tbg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tbg .tw1,.tbg .tw2{position:absolute;top:4%;width:120px;height:46px;border-radius:6px;background:repeating-linear-gradient(90deg,#fffbe6 0 14px,#cfd8e0 14px 18px);box-shadow:0 0 60px 18px rgba(255,246,214,.45),0 0 160px 40px rgba(255,236,180,.18);opacity:.92}
.tbg .tw1{left:6%}.tbg .tw2{right:6%}
.tbg .beam{position:absolute;top:8%;width:220px;height:110%;transform-origin:top center;background:linear-gradient(180deg,rgba(255,244,210,.22),rgba(255,244,210,0) 75%);filter:blur(6px);animation:tbeam 9s ease-in-out infinite alternate}
.tbg .b1{left:3%;transform:rotate(-24deg)}.tbg .b2{left:9%;transform:rotate(-12deg);animation-delay:-3s}.tbg .b3{right:9%;transform:rotate(12deg);animation-delay:-5s}.tbg .b4{right:3%;transform:rotate(24deg);animation-delay:-2s}
@keyframes tbeam{from{opacity:.55}to{opacity:1}}
.tbg .tstands{position:absolute;left:0;right:0;bottom:30%;height:22%;background:radial-gradient(circle at 10% 40%,rgba(255,255,255,.22) 0 1.2px,transparent 2px) 0 0/14px 11px,radial-gradient(circle at 60% 70%,rgba(246,183,60,.35) 0 1.2px,transparent 2px) 0 0/19px 13px,linear-gradient(180deg,#0d1a2a,#122437);opacity:.9;mask:linear-gradient(180deg,transparent,#000 35%);-webkit-mask:linear-gradient(180deg,transparent,#000 35%)}
.tbg .tfield{position:absolute;left:-10%;right:-10%;bottom:-6%;height:38%;background:repeating-linear-gradient(90deg,#1f5c33 0 8%,#246a3b 8% 16%);transform:perspective(500px) rotateX(58deg);transform-origin:bottom;box-shadow:inset 0 30px 60px rgba(0,0,0,.55)}
.tbg .tfield::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 8%)}
.tin{position:relative;z-index:1;width:100%;max-width:620px;padding:9vh 16px 40px;display:flex;flex-direction:column;align-items:center;gap:26px}
.tlogo{text-align:center}
.tkick{font-family:var(--cond);font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);font-size:14px}
.tlogo h1{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.84;font-size:clamp(54px,14vw,108px);margin:8px 0 0;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.tlogo h1 span{color:var(--amber);display:block}
.title.sm .tlogo h1{font-size:clamp(36px,8vw,56px)}.title.sm .tlogo h1 span{display:inline}.title.sm .tin{padding-top:5vh}
.bootload{width:min(100%,360px);margin-top:6vh}
.bootload .track{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.14)}
.bootload .track i{display:block;height:100%;background:repeating-linear-gradient(115deg,var(--amber) 0 14px,#ffd27a 14px 28px);background-size:40px 100%;animation:tstripe .8s linear infinite;transition:width .35s ease}
@keyframes tstripe{to{background-position:40px 0}}
.bmsg{margin-top:10px;text-align:center;font-family:var(--cond);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--mute)}
.tmenu{width:100%;display:flex;flex-direction:column;gap:12px}
.tbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;background:rgba(10,23,38,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-left:5px solid var(--amber);border-radius:10px;padding:14px 18px;color:var(--chalk);cursor:pointer;transition:transform .12s,background .12s}
.tbtn:hover,.tbtn:focus-visible{transform:translateX(4px);background:rgba(20,42,66,.92)}
.tbtn .tl{font-family:var(--display);font-weight:900;font-size:28px;text-transform:uppercase;line-height:1}
.tbtn .td{color:var(--mute);font-size:14px}
.tbtn.cont{border-left-color:#5fd38a}
.slot{display:flex;align-items:center;gap:12px;min-width:0}

function pk(a,b){return a<b?a+'|'+b:b+'|'+a}
function makeSchedule(){
  const ids=Object.keys(S.schools), played={}, hc={}; ids.forEach(i=>hc[i]=0);
  const lsize=id=>ids.filter(x=>sch(x).lg===sch(id).lg).length;
  for(let w=1;w<=10;w++){
    const un=new Set(ids);
    const order=[...ids].sort((a,b)=>lsize(a)-lsize(b)+Math.random()-.5);
    for(const t of order){
      if(!un.has(t))continue; un.delete(t);
      let best=null,bs=-1e9; const A=sch(t);
      for(const o of un){
        const B=sch(o),c=played[pk(t,o)]||0;
        let sc=Math.random()*3;
        if(A.lg===B.lg)sc+=10; if(A.isl===B.isl)sc+=6;
        sc-=Math.abs(A.elo-B.elo)/80;
        sc-=c*(A.lg===B.lg&&lsize(t)<=7?9:40);
        if(sc>bs){bs=sc;best=o}
      }
      if(!best)continue;
      un.delete(best); played[pk(t,best)]=(played[pk(t,best)]||0)+1;
      let h=t,a=best; if(hc[t]>hc[best]||(hc[t]===hc[best]&&Math.random()<.5)){h=best;a=t}
      hc[h]++; S.games.push({id:S.gid++,week:w,home:h,away:a,played:false});
    }
  }
}

function suitors(p){return Object.entries(p.interest).sort((a,b)=>b[1]-a[1])}
function commitCheck(){

      plog(p,`Wants to commit to ${s0.name}. ${why}`,'bad');news(`${p.stars}-star ${p.pos} ${p.first} ${p.last} wants to commit to you. ${why}`,'bad')}

        if(t===S.user)news(`${p.stars}-star ${p.pos} ${p.first} ${p.last} (${TOWNS[p.town][0]}) verbally committed to ${sch(S.user).name}.`,'good');
        else if(p.stars>=4||mine>=40)news(`${p.stars}-star ${p.pos} ${p.first} ${p.last} committed to ${sch(t).name}.`,mine>=40?'bad':'');
      }

        else if(o[0]===S.user)news(`You flipped ${p.stars}-star ${p.pos} ${p.first} ${p.last} away from ${sch(from).name}.`,'good');
        else if(p.stars>=4)news(`${p.stars}-star ${p.pos} ${p.first} ${p.last} flipped from ${sch(from).name} to ${sch(o[0]).name}.`);

  const cr=classRanks(), rank=cr.findIndex(x=>x[0]===S.user)+1, avgS=mine.length?mine.reduce((t,p)=>t+p.stars,0)/mine.length:0;

  const best=mine.slice().sort((a,b)=>b.stars-a.stars||b.pot-a.pot).slice(0,3).map(p=>`${p.stars}-star ${p.pos} ${p.first} ${p.last}`);

const BADGE_ORDER=['shield','circle','hex','crest','diamond'];
const EMB={};
function emblemSVG(id){
  if(EMB[id])return EMB[id];
  const d=SCHOOL_DATA.find(x=>x.id===id); if(!d)return '';
  const same=SCHOOL_DATA.filter(x=>MASCOT_ICON[x.mascot]===MASCOT_ICON[d.mascot]), k=same.indexOf(d);
  let h=0; for(const ch of id)h=(h*31+ch.charCodeAt(0))%997;
  const shape=BADGE_ORDER[(h+k*2)%BADGE_ORDER.length], bg=d.c1, trim=d.c2;
  const icon=(ICONS[MASCOT_ICON[d.mascot]]||ICONS.spears).replace(/BG/g,bg);
  const sc=shape==='diamond'?.78:shape==='circle'?.86:.9, oy=shape==='shield'?-2:0;
  const band=shape==='diamond'?'':`<rect x="27" y="${shape==='shield'?71:72}" width="46" height="15" rx="3" fill="${trim}"/><text x="50" y="${shape==='shield'?82.6:83.6}" text-anchor="middle" font-family="'Big Shoulders Display',Impact,'Arial Narrow',sans-serif" font-weight="800" font-size="12.5" letter-spacing=".5" fill="${bg}">${d.abbr}</text>`;
  const iy=shape==='diamond'?3:-6;
  return EMB[id]=`${BADGES[shape].replace(/BG/g,bg).replace(/TRIM/g,trim)}<g color="${trim}" fill="${trim}" transform="translate(50 ${50+iy+oy}) scale(${sc}) translate(-50 -47)">${icon}</g>${band}`;
}

const crest=(id,px,cls)=>LOGO_IMG[id]?`<img class="crest logo ${cls||''}" width="${px}" height="${px}" src="${LOGO_IMG[id]}" alt="" aria-hidden="true">`:`<svg class="crest ${cls||''}" width="${px}" height="${px}" viewBox="0 0 100 100" aria-hidden="true" focusable="false">${emblemSVG(id)}</svg>`;
const CREST_IMG={};
function crestImg(id){
  if(CREST_IMG[id])return CREST_IMG[id];
  const img=new Image(); if(LOGO_IMG[id]){img.src=LOGO_IMG[id];return CREST_IMG[id]=img}
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100">${emblemSVG(id)}</svg>`);
  return CREST_IMG[id]=img;
}

/* ---------- views ---------- */
const stat=(k,v)=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
function header(){
  const u=sch(S.user);
  return `<header class="top"><div class="who">${crest(u.id,84,"big")}<div><div class="brand">Island Gridiron GM · ${S.year} season</div><div class="school">${u.name}<small>${u.mascot} · ${DIV_NAME[u.div]||''} · ${wkLabel(S.week)}</small></div></div></div>
  <div class="meta">${stat('Record',`${u.w}-${u.l}`)}${stat(`${DIV_SHORT[u.div]} rank`,'#'+dRank(S.user))}${stat('Recruit hours',S.phase==='season'?S.hours:'–')}</div></header>`;
}
function tabs(){
  const T=[['home','Home'],['game','Game day'],['schedule','Schedule'],['rank','Rankings'],['playoffs','Playoffs'],['roster','Roster'],['playbook','Playbook'],['recruit','Recruiting'],['news','News'],['history','History'],['online','Play a friend']];
  return `<nav class="tabs" aria-label="Sections">${T.map(([k,l])=>`<button class="tab" data-a="tab" data-v="${k}" aria-current="${view===k}">${l}${k==='game'&&LIVE&&!LIVE.finished?' ●':''}</button>`).join('')}</nav>`;
}
function oppLine(g){const home=g.home===S.user,o=sch(home?g.away:g.home),rk=dRank(o.id);return{o,home,label:`${home?'vs':'at'} ${rk<=10?dLabel(o.id)+' ':''}${o.name}`}}
function cmpRow(lbl,a,b){const sc=v=>clamp((v-30)/60*100,4,100);return `<span class="l">${lbl}</span><div class="bar rev"><i style="width:${sc(a)}%"></i></div><b class="num">${Math.round(a)}</b><div class="bar opp"><i style="width:${sc(b)}%"></i></div><b class="num">${Math.round(b)}</b>`}
function resultBlock(g){

// ----- message handling -----
function netMsg(msg){
  const N=NET; if(!N||!msg)return;
  if(msg.sameTab){if(!N.me)N.me=msg.peer;return}
  const m=msg.data; if(!m||typeof m!=='object'||typeof m.t!=='string')return; N.heard=Date.now();
  if(N.role==='host'){
    if(m.t==='hello'){netHelloIn(msg.peer,m);return}
    if(msg.peer!==N.peer)return;
    N.fheard=Date.now();
    if(N.gone){N.gone=false;updateNetUI()}
    if(m.t==='hb')return;
    if(m.t==='call')netCallIn(m);
    else if(m.t==='got'){if(N.wait&&N.wait.id===m.b)netRelease()}
    else if(m.t==='need'){if(Array.isArray(m.miss))netResend(m.b,m.miss.filter(i=>Number.isInteger(i)&&i>=0&&i<64).slice(0,64))}
    else if(m.t==='sync'){if(LIVE&&LIVE.net&&Date.now()-(N.lastStart||0)>1500)netSendStart()}
    else if(m.t==='to'){if(LIVE&&LIVE.net){callTO(other(LIVE.side));netAsk(true)}}
    else if(m.t==='bye'){N.gone=true;updateNetUI()}
  }else{
    if(m.t==='deny'){if(m.to&&N.me&&m.to!==N.me)return;if(N.started)return;N.err=m.why==='same'?'You both picked the same team. Pick a different one.':m.why==='full'?'That game already has two players.':m.why==='version'?'Your friend has a different version of the game open. Both of you reload the page.':'Your friend\'s game turned down the request.';clearInterval(N.tick);render();return}
    if(m.t==='bye'){if(msg.peer===N.host){N.gone=true;updateNetUI()}return}
    if(m.t!=='ck'&&m.t!=='ask')return;
    if(!N.host||(N.gone&&m.t==='ck'&&m.k==='start'))N.host=msg.peer;
    if(msg.peer!==N.host)return;
    if(N.gone){N.gone=false;updateNetUI()}
    if(m.t==='ck')netChunk(m); else netAskIn(m);
  }
}
function netHelloIn(peer,m){

  }

// ----- guest side -----
function netChunk(m){const N=NET;
  if(typeof m.b!=='string'||m.b.length>40||typeof m.d!=='string'||!(m.n>=1&&m.n<=64)||!(m.i>=0&&m.i<m.n)||!['start','play'].includes(m.k))return;
  if(N.done.has(m.b)){netEmit({t:'got',b:m.b});return}
  const now=Date.now(), r=N.rx[m.b]||(N.rx[m.b]={n:m.n,k:m.k,p:[],c:0,t:now,last:now,asks:0}); r.last=now;
  if(r.p[m.i]==null){r.p[m.i]=m.d;r.c++}
  if(r.c>=r.n){delete N.rx[m.b];N.done.add(m.b);if(N.done.size>40)N.done.delete(N.done.values().next().value);
    nunzip(r.p.join('')).then(o=>{if(NET!==N)return;netEmit({t:'got',b:m.b});netGot(r.k,nclean(o))}).catch(e=>console.warn('net decode',e))}
}
function netGot(kind,o){
  const N=NET; if(!o||typeof o!=='object')return;
  if(kind==='start'){
    if(o.v!==NET_V||!o.T||!o.T.h||!o.T.a)return;
    const fix=T=>{const D=SCHOOL_DATA.find(d=>d.id===T.id);if(!D||!Array.isArray(T.roster))return null;for(const k of ['name','abbr','mascot','c1','c2','isl','lg'])T[k]=D[k];return T};
    const H=fix(o.T.h),A=fix(o.T.a); if(!H||!A)return;
    NETT={[H.id]:H,[A.id]:A};
    const g={home:H.id,away:A.id,Th:H,Ta:A,online:true,neutral:true}, sim=new Sim(g);
    netApply(sim,o.st); sim.log=Array.isArray(o.log)?o.log:[]; sim.rmap=o.rm||null;
    if(LIVE)clearTimeout(LIVE.timer);
    LIVE={game:g,sim,auto:false,speed:2,anim:null,waiting:false,timer:null,finished:!!sim.over,side:o.gs==='h'?'h':'a',net:N};
    if(kitsValid(o.kit))LIVE.kit=o.kit;
    N.started=true; N.err=null; N.ask=null; N.myCall=null; N.seq=o.seq|0; view='game'; render();
    if(o.ask&&o.ask.need)netAskIn({seq:o.ask.seq,need:o.ask.need});
    return;
  }
  const L=LIVE; if(!L||!L.net)return; const s=L.sim;
  if(kind==='play'){
    if(typeof o.l0==='number'&&o.l0!==s.log.length){if(s.log.length>o.l0)s.log.length=o.l0;else netEmit({t:'sync'})}
    if(Array.isArray(o.log))for(const e of o.log)s.log.push(e);
    netApply(s,o.st); s.rmap=o.rm||s.rmap; N.seq=Math.max(N.seq,o.seq|0);
    if(N.myCall&&N.myCall.seq<=N.seq){N.myCall=null;clearInterval(N.callT)}
    N.ask=null;
    const ev=o.ev&&typeof o.ev==='object'?o.ev:{kind:'none'}; let frames=null; try{frames=o.fr?decFrames(o.fr):null}catch(e){frames=null}
    const pre=o.pre&&o.pre.score?o.pre:{score:{...s.score},poss:s.poss,mid:'',dd:'',n:s.log.length,phase:s.phase};
    L.waiting=false; L.anim={ev,frames,pre,t0:performance.now(),dur:clamp(+o.dur||1000,100,20000),done:false};
    updateGameUI();
  }
}
function netAskIn(m){const N=NET,L=LIVE;if(!L||!L.net)return;
  if(typeof m.seq!=='number'||m.seq<N.seq)return;
  if(m.st){netApply(L.sim,Object.assign({},m.st));}
  if(typeof m.ln==='number'&&m.ln!==L.sim.log.length)netEmit({t:'sync'});
  if(!m.need){if(N.myCall&&N.myCall.seq===m.seq){N.myCall=null;clearInterval(N.callT)}N.ask=null;updateGameUI();return}
  if(N.myCall&&N.myCall.seq===m.seq){netEmit(N.myCall);return}
  if(!['o','d','pat'].includes(m.need))return;
  const fresh=!N.ask||N.ask.seq!==m.seq; N.ask={seq:m.seq,need:m.need}; N.seq=m.seq;
  if(fresh&&(!L.anim||L.anim.done)){L.waiting=m.need;updateGameUI()}else updateGameUI();
}
function netGuestIdle(){const L=LIVE,N=NET;if(!L||!N)return;
  if(L.sim.over){L.finished=true;L.waiting=false;updateGameUI();return}

async function packStr(t){if(typeof CompressionStream==='undefined')return'j'+t;const st=new Blob([t]).stream().pipeThrough(new CompressionStream('gzip'));return'z'+b64e(new Uint8Array(await new Response(st).arrayBuffer()))}

function deleteSlot(id){
  try{localStorage.removeItem(SLOT(id))}catch(e){}
  SLOTS.slots=SLOTS.slots.filter(s=>s.id!==id); if(SLOTS.active===id)SLOTS.active=SLOTS.slots.length?SLOTS.slots.slice().sort((a,b)=>b.upd-a.upd)[0].id:null; idxSave();
  if(SLOTID===id){SLOTID=null;S=null;LIVE=null} if(PRE&&PRE.id===id)PRE=null;
}
async function startCareer(uid){
  if(SLOTS.slots.length>=MAX_SLOTS){toast(`You have ${MAX_SLOTS} saves. Delete one from Load game first.`);return}
  if(LIVE&&!LIVE.net){clearTimeout(LIVE.timer);LIVE=null}
  newCareer(uid); SLOTID=newSlotId(); await flushSave(); view='home'; render(); window.scrollTo(0,0);
}
function dlCap(){if(!DLP)DLP=(async()=>{try{return(window.claude&&typeof window.claude.use==='function')?await window.claude.use('downloads'):null}catch(e){return null}})();return DLP}
async function exportSlot(id){
  let data=null;
  if(id===SLOTID&&S&&!S.tmp){await flushSave();data=S}else{try{data=await unpackStr(localStorage.getItem(SLOT(id)))}catch(e){}}
  if(!validCareer(data)){toast('That save could not be read.');return}
  const m=SLOTS.slots.find(s=>s.id===id)||{}, fn=`island-gridiron-${data.user}-${data.year}-week${data.week}.json`;
  const blob=new Blob([JSON.stringify({app:'island-gridiron-gm',fmt:1,saved:new Date().toISOString(),name:m.name||'',data})],{type:'application/json'});
  const dl=await dlCap();
  if(dl){try{await dl.save({filename:fn,data:blob});toast('Save file downloaded.');return}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Save file downloaded.')}catch(e){toast('Downloads are not available in this view.')}
}
async function importFile(file){
  if(!file)return; if(file.size>40e6){toast('That file is too big to be a save.');return}
  if(SLOTS.slots.length>=MAX_SLOTS){toast(`You have ${MAX_SLOTS} saves. Delete one first.`);return}
  let o=null;try{o=JSON.parse(await file.text())}catch(e){}
  const data=o&&o.app==='island-gridiron-gm'?o.data:o;
  if(!validCareer(data)){toast('That isn\'t an Island Gridiron save file.');return}
  if(!SCHOOL_DATA.some(d=>d.id===data.user)){toast('That save is for a school this version doesn\'t have.');return}
  if(LIVE&&!LIVE.net){clearTimeout(LIVE.timer);LIVE=null}
  if(!adoptCareer(nclean(data))){toast('That save could not be read.');return}
  SLOTID=newSlotId(); await flushSave(); view='home'; render(); window.scrollTo(0,0); toast('Save file loaded.');
}
// leaving a career for the title screen
async function toMenu(){
  if(LIVE&&!LIVE.finished&&!LIVE.net){if(!menuArmed){menuArmed=true;render();return}clearTimeout(LIVE.timer);LIVE=null}
  menuArmed=false; await flushSave(); TITLE={pane:'main',arm:null}; view='title'; render(); window.scrollTo(0,0);
}

// ----- boot -----
async function boot(){
  const t0=performance.now(), step=(p,msg)=>{BOOT.p=Math.max(BOOT.p,p);if(msg)BOOT.msg=msg;const b=document.getElementById('bootbar'),m=document.getElementById('bootmsg');if(b)b.style.width=Math.round(BOOT.p*100)+'%';if(m)m.textContent=BOOT.msg};
  render(); step(.08);
  idxLoad();
  // bring a career from the old single save over into a slot
  try{const t=localStorage.getItem(KEY);if(t){step(.2,'Finding your old career');const o=JSON.parse(t);if(validCareer(o)&&adoptCareer(o)){SLOTID=newSlotId();if(await flushSave())localStorage.removeItem(KEY)}S=null;SLOTID=null}}catch(e){S=null;SLOTID=null}
  step(.3,'Painting the yard lines');
  try{if(document.fonts&&document.fonts.ready)await Promise.race([document.fonts.ready,nsleep(2500)])}catch(e){}
  step(.5,'Hanging the team banners');
  const ims=Object.keys(LOGO_IMG).map(id=>{const im=crestImg(id);return im.decode?im.decode().catch(()=>{}):Promise.resolve()});
  await Promise.race([Promise.all(ims),nsleep(2500)]);
  step(.65,'Tuning the band');try{await Promise.race([BAND.load(),nsleep(3000)])}catch(e){}
  step(.75,'Opening the gates');
  const last=SLOTS.active&&SLOTS.slots.find(s=>s.id===SLOTS.active);
  if(last){try{const d=await unpackStr(localStorage.getItem(SLOT(last.id)));if(validCareer(d))PRE={id:last.id,data:d}}catch(e){}}
  step(1,'Kickoff');
  const wait=Math.max(0,1300-(performance.now()-t0)); if(!REDUCED)await nsleep(wait);
  BOOT.done=true; view='title'; render();
}
const fmtAgo=ms=>{const s=(Date.now()-ms)/1000;return s<90?'just now':s<3600?`${Math.round(s/60)} min ago`:s<86400?`${Math.round(s/3600)} hr ago`:new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const slotWhen=m=>`${m.year||''} · ${m.phase==='offseason'?'Offseason':m.week>10?'Playoffs':'Week '+(m.week||1)}`;
function titleBG(){return `<div class="tbg" aria-hidden="true"><i class="tw1"></i><i class="tw2"></i><i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="beam b4"></i><div class="tstands"></div><div class="tfield"></div></div>`}
function titleLogo(){return `<div class="tlogo"><div class="tkick">Hawaiʻi high school football</div><h1>Island <span>Gridiron</span> GM</h1></div>`}
function vBoot(){return `<div class="title boot">${titleBG()}<div class="tin">${titleLogo()}<div class="bootload" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><div class="track"><i id="bootbar" style="width:${Math.round(BOOT.p*100)}%"></i></div><div class="bmsg" id="bootmsg">${BOOT.msg}</div></div></div></div>`}
function slotCard(m,big){const d=SCHOOL_DATA.find(x=>x.id===m.school)||{};
  return `<div class="slot ${big?'big':''}" style="--tc:${d.c1||'#456'}">${crest(m.school,big?64:44)}<div class="sinfo"><div class="sn">${d.name||m.name||'Career'}</div><div class="sm">${d.mascot||''} · ${slotWhen(m)} · ${m.rec||'0-0'}</div><div class="sa">Saved ${fmtAgo(m.upd||Date.now())}</div></div></div>`}
function vTitle(){
  const P=TITLE.pane, list=SLOTS.slots.slice().sort((a,b)=>b.upd-a.upd), last=SLOTS.active&&list.find(s=>s.id===SLOTS.active)||list[0];
  let inner;
  if(P==='load'){
    inner=`<div class="tpanel"><div class="tph"><h2>Load game</h2><button class="btn sm" data-a="tpane" data-v="main">← Back</button></div>
    ${list.length?list.map(m=>`<div class="srow">${slotCard(m)}<div class="sbtn"><button class="btn sm pri" data-a="loadslot" data-v="${m.id}">Load</button><button class="btn sm" data-a="expslot" data-v="${m.id}">Export file</button><button class="btn sm ${TITLE.arm===m.id?'danger':''}" data-a="delslot" data-v="${m.id}">${TITLE.arm===m.id?'Really delete?':'Delete'}</button></div></div>`).join(''):'<p class="muted">No saved careers yet.</p>'}
    <p class="muted small">Up to ${MAX_SLOTS} careers save in this browser, each one automatically as you play. Export a save file to keep a copy, move it to another device, or send it to a friend.</p>
    <div class="row"><label class="btn"><input type="file" id="impfile" accept=".json,application/json" hidden>Import save file</label></div></div>`;
  }else{
    inner=`<nav class="tmenu" aria-label="Main menu">
      ${last?`<button class="tbtn cont" data-a="loadslot" data-v="${last.id}"><span class="tl">Continue</span>${slotCard(last,true)}</button>`:''}
      <button class="tbtn" data-a="newcareer"><span class="tl">New career</span><span class="td">Pick a program and take over</span></button>
      <button class="tbtn" data-a="tpane" data-v="load"><span class="tl">Load game</span><span class="td">${list.length?`${list.length} saved career${list.length>1?'s':''} · import a file`:'Import a save file'}</span></button>
      <button class="tbtn" data-a="online"><span class="tl">Play a friend online</span><span class="td">Head-to-head exhibition</span></button>
    </nav>`;
  }
  return `<div class="title ${P==='load'?'sm':''}">${titleBG()}<div class="tin">${titleLogo()}${inner}<p class="tfoot">All players are fictional. Careers save in this browser.</p></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(S&&S.snd!==false)SND.resume();
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a!=='reset'&&resetArmed){resetArmed=false}
  if(a!=='menu')menuArmed=false;
  if(a==='choose'){startCareer(v)}
  else if(a==='tpane'){TITLE={pane:v,arm:null};view='title';render();window.scrollTo(0,0)}
  else if(a==='newcareer'){view='newcareer';render();window.scrollTo(0,0)}
  else if(a==='loadslot'){if(SLOTID===v&&S&&!S.tmp){view='home';render();window.scrollTo(0,0)}else loadSlot(v)}
  else if(a==='expslot')exportSlot(v)
  else if(a==='delslot'){if(TITLE.arm!==v){TITLE.arm=v;render();return}TITLE.arm=null;deleteSlot(v);render()}
  else if(a==='menu')toMenu()
  else if(a==='uni'){const [k,val]=v.split('|');setUni({[k]:val})}
  else if(a==='unipre'){const pr=UNI_PRE.find(x=>x[0]===v);if(pr)setUni(pr[1])}
  else if(a==='exportcur'){if(SLOTID)exportSlot(SLOTID)}
  else if(a==='tab'){view=v;if(v==='recruit')RS.sel=null;render()}
  else if(a==='kickoff'){if(LIVE&&!LIVE.finished){view='game';render()}else startLive()}
  else if(a==='advance')advanceWeek();
  else if(a==='aiwrite'){const ar=S.articles&&S.articles[0];if(ar){ar.aiErr=null;writeWithClaude(ar)}}
  else if(a==='newseason')newSeason();
  else if(a==='call'||a==='dcall')pickCall(a,v)
  else if(a==='online'){view='online';render();window.scrollTo(0,0)}
  else if(a==='nethost'){const t=document.getElementById('nethteam');netHost(t?t.value:'kahuku')}
  else if(a==='netjoin'){const c=document.getElementById('netcode'),t=document.getElementById('netgteam');netJoin(c?c.value:'',t?t.value:'mililani')}
  else if(a==='netleave')netLeave()
  else if(a==='netretry'){ROOMP=null;ROOMOK=null;render()}
  else if(a==='netrematch')netRematch()
  else if(a==='press'){S.press=v;save();renderDock()}
  else if(a==='calld'){S.callD=!S.callD;save();if(LIVE&&LIVE.waiting==='d'&&!S.callD)doPlay();if(view==='game')updateGameUI();else render()}
  else if(a==='diff'){S.diff=v;save();render()}
  else if(a==='autorec'){S.autoRec=S.autoRec===false?true:false;save();render()}
  else if(a==='userto'){if(LIVE&&!LIVE.finished){if(LIVE.net&&NET&&NET.role==='guest'){netEmit({t:'to'});toast('Timeout requested.')}else{callTO(LIVE.side);if(LIVE.net)netAsk(true)}}}
  else if(a==='depth'){
    const [pos,id,mv]=v.split('|'), u=sch(S.user); u.depth=u.depth||{}; const order=topAt(u,pos,99,true).map(p=>p.id), k=order.indexOf(+id);
    if(k>=0){order.splice(k,1);if(mv==='start')order.splice(STARTERS[pos]-1,0,+id);else order.splice(clamp(k+(+mv),0,order.length),0,+id)}
    u.depth[pos]=order; save(); render();
  }
  else if(a==='depthreset'){const u=sch(S.user);if(v==='all')u.depth={};else if(u.depth)delete u.depth[v];save();render()}
  else if(a==='band'){S.band=S.band===false?true:false;save();if(S.band===false)BAND.hush(.5);if(view==='game'&&LIVE)updateGameUI();else render()}
  else if(a==='bandrm'){BAND.remove(v).then(()=>render())}
  else if(a==='snd'){S.snd=S.snd===false?true:false;save();if(S.snd)SND.resume();else SND.crowdOff();updateGameUI()}
  else if(a==='cam'){S.cam=S.cam==='full'?'follow':'full';save();updateGameUI()}
  else if(a==='scheme'){sch(S.user).scheme=v;save();render()}
  else if(a==='auto'){LIVE.auto=!LIVE.auto;if(LIVE.auto&&LIVE.waiting)doPlay();updateGameUI()}
  else if(a==='speed'){LIVE.speed=+v;if(!LIVE.net){S.speed=+v;save()}updateGameUI()}
  else if(a==='simend')simToEnd();
  else if(a==='rec'){const [pid,k]=v.split('|');recruitAction(pid,k,RS.pitch)}
  else if(a==='board'){const p=S.prospects.find(x=>x.id===v);if(p){p.board=!p.board;save();render()}}
  else if(a==='prof'){RS.sel=v||null;view='recruit';render();window.scrollTo(0,0)}
  else if(a==='fs'){setFS(!document.body.classList.contains('fs'))}
  else if(a==='reset'){if(!resetArmed){resetArmed=true;render();return}resetArmed=false;if(LIVE)clearTimeout(LIVE.timer);LIVE=null;S=null;try{localStorage.removeItem(KEY)}catch(e){}render();window.scrollTo(0,0)}
});
document.addEventListener('keydown',e=>{
  if(LIVE&&view==='game'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName||''))){if(e.key==='f'||e.key==='F'){e.preventDefault();setFS(!document.body.classList.contains('fs'));return}if(e.key==='Escape'&&document.body.classList.contains('fs')){setFS(false);return}}
  if(!LIVE||!LIVE.waiting||view!=='game'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName||'')))return;
  if(!/^[0-9]$/.test(e.key))return; const i=e.key==='0'?9:+e.key-1, k=DOCK_KEYS[i]; if(!k)return; e.preventDefault();
  pickCall(k[0],k[1]);
});
document.addEventListener('change',e=>{if(e.target.id==='bandfile'){const fs=[...(e.target.files||[])];e.target.value='';BAND.add(fs).then(()=>render());return}if(e.target.id==='impfile'){importFile(e.target.files&&e.target.files[0]);e.target.value='';return}const d=e.target.dataset||{};if(d.v3){S.view=e.target.value;save();return}if(d.lbl){S.labels=e.target.value;save();return}if(d.p){RS.pitch=e.target.value;return}if(!d.f)return;RF[d.f]=e.target.value;render()});
function migrate(){if(!S)return;if(S.v===1){S.v=2;S.cred=75;S.promises=[];S.aidLeft=4;for(const p of S.prospects){enrich(p);if(S.phase==='offseason'&&p.committed)p.signed=true}rankProspects()}
  if(S.v===2){S.v=3;S.callD=false;for(const sc of Object.values(S.schools)){if(!sc.scheme)assignScheme(sc);ensureNums(sc)}}
  if(S.v===3){S.v=4;assignDivisions()}
  if(S.v===4){S.v=5;recInit()}
  if(S.v===5){S.v=6;S.pipe={};S.geLeft=GE_PER_YEAR;for(const p of S.prospects)enrich(p)}
  if(S.v===6){S.v=7;for(const sc of Object.values(S.schools)){const av=new Set();for(const p of sc.roster){if(!p.recruit)nameIt(p,null,av)}}for(const p of S.prospects)if(!p.signed){const n=genName(p.town);p.first=n.first;p.last=n.last;p.bio=null;enrich(p)}}
  if(S.v===7){S.v=8;for(const sc of Object.values(S.schools)){const av=new Set();for(const p of sc.roster){if(!p.recruit)nameIt(p,null,av)}}for(const p of S.prospects)if(!p.signed){const n=genName(p.town);p.first=n.first;p.bio=null;enrich(p)}}
  for(const d of SCHOOL_DATA){const sc=S.schools[d.id];if(sc){sc.c1=d.c1;sc.c2=d.c2}}}
boot();
</script>
